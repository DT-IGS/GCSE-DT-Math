<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision site</title>
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#1f2430;--mu:#5d6472;--card:#fff;--bd:#d9d6cc;--ac:#1f5fbf;--ab:#e7effb;--ok:#17703a;--okb:#e3f4e9;--no:#a4361f;--nob:#fbe9e4;--wa:#7a5000;--wab:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#15181e;--fg:#e8e9ec;--mu:#a3a9b5;--card:#1e222a;--bd:#363c48;--ac:#8db6f5;--ab:#243247;--ok:#7fd49c;--okb:#1d3527;--no:#f0a08e;--nob:#3b2420;--wa:#f0c36b;--wab:#3a3017}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:860px;margin:0 auto}
h1{font-size:1.4rem;margin:0}h2{font-size:1.2rem;margin:20px 0 8px}h3{font-size:1.05rem;margin:0 0 6px}
.mu{color:var(--mu)}.src{color:var(--mu);font-size:.82rem;margin:6px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
nav div{max-width:860px;margin:0 auto;padding:6px 12px;display:flex;gap:6px;overflow-x:auto}
main{max-width:860px;margin:0 auto;padding:8px 16px 60px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}button.on{background:var(--ab);border-color:var(--ac);color:var(--ac);font-weight:600}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0}
.ex{background:var(--ab);border-radius:8px;padding:8px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
tr.now td{background:var(--ab)}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}.opts button{text-align:left;white-space:normal}
.good{background:var(--okb)!important;border-color:var(--ok)!important;color:var(--ok)}.bad{background:var(--nob)!important;border-color:var(--no)!important;color:var(--no)}
.note{background:var(--wab);color:var(--wa);border-radius:8px;padding:6px 10px;margin:8px 0}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--ac);color:var(--ac);border-radius:20px;padding:0 8px;margin-left:6px}
textarea{width:100%;min-height:110px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 4px}
.hid{display:none}details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.cl label{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.cl input{margin-top:6px;width:18px;height:18px}
li.pt{list-style:none;margin:6px 0;padding:6px 10px;border-radius:8px}li.pt.good,li.pt.bad{color:var(--fg)}ul.pts{padding:0}
.draw{border:2px dashed var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.chk li{margin:4px 0}.chk .e{color:var(--no)}.chk .w{color:var(--wa)}
</style>
</head>
<body>
<header id="hd"></header>
<nav><div id="nv"></div></nav>
<main id="app"><p>Loading...</p></main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>new Date(s+'T00:00:00Z'), A=(d,n)=>new Date(d.getTime()+n*864e5);
const F=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const today=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/×/g,'x').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'');
const hit=(a,l)=>{const raw=' '+a.toLowerCase().replace(/\s+/g,' '),ns=norm(a);return l.some(w=>w!==w.trim()?raw.includes(w.toLowerCase()):ns.includes(norm(w)))};
const CHECK=/[?&]check\b/.test(location.search);
const load=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});
let SITE,TOP=[],ST={c:{},q:{}};
const key=()=>'rev:'+SITE.id;
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(ST))}catch(e){}};
const TABS=[['check','Checklist'],['warm','Warm-up'],['learn','Learn'],['words','Words'],['trap','Watch out'],['quiz','Quiz'],['gaps','Gaps'],['exam','Exam'],['link','Connect']];
const topicOf=n=>TOP.find(t=>t.n===n);
const pct=t=>{const k=t.checklist.length;return k?Math.round(100*t.checklist.filter((_,i)=>ST.c[t.n+':'+i]).length/k):0};
const bar=p=>`<div class="bar" role="img" aria-label="${p} percent"><i style="width:${p}%"></i></div>`;

function sched(){
  const S=SITE,per=S.sessionsPerWeek||1,step=Math.max(1,Math.round(7/per)),hol=d=>(S.holidays||[]).some(h=>d>=P(h.from)&&d<=P(h.to));
  let d=P(S.start);const out=[];
  for(const p of S.plan){const ds=[];for(let i=0;i<p.weeks*per;i++){while(hol(d))d=A(d,step);ds.push(d);d=A(d,step)}out.push({topic:p.topic,dates:ds})}
  return out;
}

function home(){
  const S=SITE,sc=sched(),t=today(),p=(S.papers||[])[0];let h='';
  if(p){const d=Math.ceil((P(p.date)-t)/864e5);
    h+=`<div class="card"><h3>${esc(p.name)}</h3>${F(P(p.date))} ${P(p.date).getUTCFullYear()}, ${esc(p.time)}. ${esc(p.length)}, ${esc(p.marks)}.${d>0?` <b>${d} days to go.</b>`:''}<p class="mu">${esc(p.covers)}</p></div>`}
  h+=`<h2>Your plan</h2><p class="mu">${esc(S.sessions)}. Tick the checklist in each topic as you go.</p><div class="card"><table><tr><th>Date</th><th>Topic</th><th>Done</th></tr>`;
  sc.forEach((s,i)=>{const T=topicOf(s.topic);if(!T)return;const next=sc[i+1]?sc[i+1].dates[0]:A(s.dates[s.dates.length-1],7);
    const now=t>=s.dates[0]&&t<next;
    h+=`<tr class="${now?'now':''}"><td>${F(s.dates[0])}${s.dates.length>1?' to '+F(s.dates[s.dates.length-1]):''}</td><td><a href="#t${T.n}/check">${T.n}. ${esc(T.name)}</a>${now?'<span class="pill">this week</span>':''}</td><td style="width:90px">${pct(T)}%${bar(pct(T))}</td></tr>`});
  h+='</table></div>';
  (S.holidays||[]).forEach(x=>h+=`<p class="mu">${esc(x.name)}: ${F(P(x.from))} to ${F(P(x.to))}. No sessions are planned in this time.</p>`);
  h+=`<h2>Command words</h2><details><summary>What the exam words ask you to do</summary>`;
  (S.commandWords||[]).forEach(c=>h+=`<div class="card"><b>${esc(c.word)}</b><br>${esc(c.meaning)}</div>`);
  h+=`<p class="src">Source: ${esc(S.commandSource||'')}</p></details><h2>Skills</h2>`;
  (S.skills||[]).forEach(k=>h+=`<details><summary>${esc(k.name)}</summary><div class="card"><p>${esc(k.why)}</p><ol>${k.steps.map(x=>`<li>${x}</li>`).join('')}</ol><p class="ex"><b>Example.</b> ${esc(k.example)}</p><p class="src">Source: ${esc(k.source)}</p></div></details>`);
  if((S.resources||[]).length){h+='<h2>Resources</h2><ul>'+S.resources.map(r=>`<li><a href="${esc(r.url||'#')}" target="_blank" rel="noopener">${esc(r.title||r.name||r.url)}</a></li>`).join('')+'</ul>'}
  if(S.video&&S.video.url)h+=`<h2>Video</h2><p><a href="${esc(S.video.url)}" target="_blank" rel="noopener">${esc(S.video.title||S.video.url)}</a></p>`;
  return h;
}

const R={
check:T=>`<p class="mu">Tick a statement when you can do it without help. Key statements matter most.</p><div class="card cl">${T.checklist.map((c,i)=>`<label><input type="checkbox" data-ck="${T.n}:${i}" ${ST.c[T.n+':'+i]?'checked':''}><span>${esc(c.text)}${c.key?'<span class="pill">key</span>':''}</span></label>`).join('')}</div><div id="cp">${pct(T)}% ticked${bar(pct(T))}</div>`,
warm:T=>`<p class="mu">Try each question first. Then reveal the answer.</p>`+T.warmup.map((w,i)=>`<div class="card"><span class="pill" style="margin:0">${esc(w.when)}</span><p>${esc(w.q)}</p><button data-act="rev" data-t="w${i}">Show answer</button><p id="w${i}" class="hid ex">${esc(w.a)}</p></div>`).join(''),
learn:T=>T.knowledge.map((k,i)=>`<article class="card" id="k${i}"><h3>${esc(k.title)}</h3><p>${k.text}</p>${k.steps?`<ol>${k.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}<p class="ex"><b>Example.</b> ${k.example}</p><p class="src">Source: ${esc(k.source)}</p></article>`).join('')+((T.images||[]).length?'<h2>Draw these</h2>'+T.images.map(m=>`<div class="draw"><b>${esc(m.title)}</b><br>${esc(m.describe)}</div>`).join(''):''),
words:T=>`<div class="card"><table>${T.keywords.map(k=>`<tr><th>${esc(k.term)}</th><td>${esc(k.meaning)}</td></tr>`).join('')}</table></div>`,
trap:T=>`<p class="mu">Ideas that are easy to get slightly wrong, and a better way to think.</p>`+T.misconceptions.map(m=>`<div class="card"><p><b>Tempting idea:</b> ${esc(m.wrong)}</p><p class="ex"><b>Better idea:</b> ${esc(m.right)}</p><p class="src">Source: ${esc(m.source)}</p></div>`).join(''),
quiz:T=>`<p class="mu">Pick an answer. You will see at once if it is right.</p>`+T.quiz.map((q,i)=>`<div class="card qq" data-i="${i}"><p><b>${i+1}.</b> ${esc(q.q)}</p><div class="opts">${q.options.map((o,j)=>`<button data-act="qz" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('')}</div><p class="fb" aria-live="polite"></p></div>`).join('')+`<p id="qs" class="mu">Best score: ${ST.q[T.n]!=null?ST.q[T.n]+' out of '+T.quiz.length:'none yet'}</p>`,
gaps:T=>{const g=T.gaps,ans=[...g.text.matchAll(/\{(.+?)\}/g)].map(m=>m[1]),bank=[...new Set([...ans,...g.extra])].sort();let i=0;
  const body=esc(g.text).replace(/\{(.+?)\}/g,()=>`<select data-gi="${i++}" aria-label="gap ${i}"><option value="">choose</option>${bank.map(b=>`<option>${esc(b)}</option>`).join('')}</select>`);
  return `<p class="mu">Choose the right word for each gap.</p><div class="card">${body}</div><button data-act="gp">Check</button> <span id="gr" aria-live="polite"></span>`},
exam:T=>`<p class="mu">Write your working in the box, then check. The check looks for key steps, so it is a guide and not a mark. These questions use different numbers from the original papers. The original is named in each card.</p>`+T.exam.map((e,i)=>`<div class="card"><h3>${esc(e.type)}<span class="pill">${e.marks} mark${e.marks>1?'s':''}</span><span class="pill">about ${e.minutes} min</span></h3><p class="mu">Command: <b>${esc(e.command)}</b>. You need to ${esc(e.asks)}</p><p><b>${esc(e.question)}</b></p><details><summary>Plan</summary><ol>${e.plan.map(s=>`<li>${s}</li>`).join('')}</ol></details><details><summary>Hint</summary><p>${esc(e.hint)}</p></details><details><summary>What earns marks</summary><p>${e.gets}</p><p>${esc(e.watch)}</p><p class="src">Source: ${esc(e.source)}</p><p class="src">${esc(e.find)}</p></details><textarea id="ta${i}" aria-label="Your working for question ${i+1}"></textarea><p><button data-act="ex" data-e="${i}">Check my working</button> <button data-act="mod" data-e="${i}">Show model answer</button></p><div id="ex${i}" aria-live="polite"></div></div>`).join(''),
link:T=>`<p class="mu">Think about each question, then reveal.</p>`+T.connect.map((c,i)=>`<div class="card"><p>${esc(c.q)}</p><button data-act="rev" data-t="c${i}">Show answer</button><p id="c${i}" class="hid ex">${esc(c.a)}</p></div>`).join('')+((T.links||[]).length?'<h2>Links</h2><ul>'+T.links.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||l.url)}</a></li>`).join('')+'</ul>':'')
};

function render(){
  const [r,tab]=(location.hash.slice(1)||'').split('/'),m=/^t(\d+)$/.exec(r||''),T=m&&topicOf(+m[1]);
  $('#nv').innerHTML=`<button class="${T?'':'on'}" onclick="location.hash=''">Home</button>`+TOP.map(t=>`<button class="${T&&T.n===t.n?'on':''}" onclick="location.hash='t${t.n}/check'" title="${esc(t.name)}">${t.n}</button>`).join('');
  let h='';
  if(!T){h=(CHECK?audit():'')+home();document.title=SITE.subject}
  else{const cur=R[tab]?tab:'check';document.title=`${T.name} | ${SITE.subject}`;
    h=`<h2>${T.n}. ${esc(T.name)}</h2><p class="mu">${esc(T.section)}</p><div class="tabs">${TABS.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="location.hash='t${T.n}/${k}'">${l}</button>`).join('')}</div>`+R[cur](T)}
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

function showCard(T,title){const i=T.knowledge.findIndex(k=>k.title===title);location.hash='t'+T.n+'/learn';setTimeout(()=>{const e=document.getElementById('k'+i);if(e){e.scrollIntoView();e.style.outline='3px solid var(--ac)'}},30)}
const curT=()=>{const m=/^t(\d+)/.exec(location.hash.slice(1));return m&&topicOf(+m[1])};

document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.ck;if(!c)return;ST.c[c]=e.target.checked;save();const T=curT();$('#cp').innerHTML=pct(T)+'% ticked'+bar(pct(T))});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const T=curT(),a=b.dataset.act;
  if(a==='rev'){$('#'+b.dataset.t).classList.toggle('hid')}
  if(a==='see'){showCard(T,b.dataset.see)}
  if(a==='qz'){const box=b.closest('.qq');if(box.dataset.done)return;box.dataset.done=1;
    const q=T.quiz[+b.dataset.q],ok=+b.dataset.o===q.answer;b.classList.add(ok?'good':'bad');
    if(ok)box.dataset.ok=1;else box.querySelectorAll('button')[q.answer].classList.add('good');
    box.querySelector('.fb').innerHTML=ok?'Correct.':`Not quite. ${esc(q.hint)} <button data-act="see" data-see="${esc(q.see)}">Open the card: ${esc(q.see)}</button>`;
    const done=document.querySelectorAll('.qq[data-done]').length,sc=document.querySelectorAll('.qq[data-ok]').length;
    if(done===T.quiz.length){if(ST.q[T.n]==null||sc>ST.q[T.n])ST.q[T.n]=sc;save();$('#qs').textContent=`You scored ${sc} out of ${done}. Best score: ${ST.q[T.n]}.`}}
  if(a==='gp'){const ans=[...T.gaps.text.matchAll(/\{(.+?)\}/g)].map(m=>m[1]);let n=0;
    document.querySelectorAll('[data-gi]').forEach(s=>{const ok=s.value===ans[+s.dataset.gi];s.classList.toggle('good',ok);s.classList.toggle('bad',!ok);if(ok)n++});
    $('#gr').textContent=n===ans.length?'All correct.':`${n} of ${ans.length} correct. Change the red ones and check again.`}
  if(a==='ex'){const i=+b.dataset.e,E=T.exam[i],v=$('#ta'+i).value;
    if(!v.trim()){$('#ex'+i).innerHTML='<p class="note">Write some working first.</p>';return}
    let n=0;const li=E.answer.map(p=>{const ok=hit(v,p.look);if(ok)n++;return ok?`<li class="pt good">Found: ${esc(p.text)}</li>`:`<li class="pt bad">Not found yet. <button data-act="see" data-see="${esc(p.see)}">Open the card: ${esc(p.see)}</button></li>`}).join('');
    $('#ex'+i).innerHTML=`<p><b>${n} of ${E.answer.length} steps found.</b> ${n===E.answer.length?'Well done.':'Look at the steps still missing and try again.'}</p><ul class="pts">${li}</ul>`}
  if(a==='mod'){const E=T.exam[+b.dataset.e];$('#ex'+b.dataset.e).innerHTML='<p><b>Model answer</b></p><ol>'+E.answer.map(p=>`<li>${esc(p.text)}</li>`).join('')+'</ol>'}
});

function audit(){
  const out=[],S=SITE,add=(l,m)=>out.push([l,m]);
  const bad=s=>isNaN(P(s));
  ['id','subject','course','start','plan','topics'].forEach(k=>{if(!S[k])add('e','content.js: "'+k+'" is missing')});
  if(bad(S.start))add('e','start date is not valid');
  (S.papers||[]).forEach(p=>{if(bad(p.date))add('e','paper date is not valid: '+p.name)});
  (S.holidays||[]).forEach(h=>{if(bad(h.from)||bad(h.to))add('e','holiday date is not valid: '+h.name)});
  if(!S.checked||!S.checked.by)add('w','The content has not been signed off yet (checked.by is empty)');
  const sc=sched(),last=sc.length&&sc[sc.length-1].dates.slice(-1)[0],p0=(S.papers||[])[0];
  if(last&&p0&&last>=P(p0.date))add('e','The plan runs past the exam date');
  S.plan.forEach(p=>{if(!topicOf(p.topic))add('e','The plan uses topic '+p.topic+' but there is no file for it')});
  TOP.forEach((t,i)=>{if(t.n!==i+1)add('e','Topic files are not numbered 1, 2, 3 with no gaps (found '+t.n+' in position '+(i+1)+')');
    const w='Topic '+t.n+': ',ti=t.knowledge.map(k=>k.title);
    if(!t.checklist.length)add('e',w+'checklist is empty');
    t.knowledge.forEach(k=>{if(!k.example)add('e',w+'card has no example: '+k.title)});
    t.quiz.forEach((q,j)=>{if(!ti.includes(q.see))add('e',w+'quiz '+(j+1)+' "see" matches no card: '+q.see);if(!(q.answer>=0&&q.answer<q.options.length))add('e',w+'quiz '+(j+1)+' answer number is outside the options')});
    let prev=0;t.exam.forEach((e,j)=>{if(e.marks<prev)add('e',w+'exam questions are not in order of marks');prev=e.marks;
      if(!e.answer.length)add('e',w+'exam '+(j+1)+' has no answer points');
      e.answer.forEach((a,k)=>{if(!ti.includes(a.see))add('e',w+'exam '+(j+1)+' point '+(k+1)+' "see" matches no card: '+a.see);
        if(!a.look||!a.look.length)add('e',w+'exam '+(j+1)+' point '+(k+1)+' has no look words');
        else if(!hit(a.text,a.look))add('e',w+'exam '+(j+1)+' point '+(k+1)+': the model answer does not contain its own look words');
        else if(a.look.some(x=>x.trim().length<2))add('w',w+'exam '+(j+1)+' point '+(k+1)+' has a very short look word')})});
    const gp=(t.gaps.text.match(/\{.+?\}/g)||[]).length;if(!gp)add('e',w+'gaps text has no {gaps}');
    const f=(s,pth)=>{if(/[—–]|[A-Za-z] - [A-Za-z]/.test(s))add('w',w+'dash used as punctuation at '+pth);if(/\b(colors?|centers?|meters?|gray|analyz\w*|organiz\w*|favor\w*|math)\b/i.test(s))add('w',w+'possible American spelling at '+pth)};
    (function walk(o,pth){if(typeof o==='string')f(o,pth);else if(Array.isArray(o))o.forEach((x,i)=>walk(x,pth+'['+i+']'));else if(o&&typeof o==='object')for(const k in o)if(k!=='look')walk(o[k],pth+'.'+k)})(t,'topic');
  });
  const e=out.filter(x=>x[0]==='e').length;
  return `<div class="card chk"><h3>Check mode: ${e} problem${e===1?'':'s'}, ${out.length-e} warning${out.length-e===1?'':'s'}</h3>${out.length?'<ul>'+out.map(x=>`<li class="${x[0]}">${x[0]==='e'?'Problem':'Warning'}: ${esc(x[1])}</li>`).join('')+'</ul>':'<p>Nothing found.</p>'}</div>`;
}

(async()=>{
  if(!await load('content.js')){$('#app').innerHTML='<p class="note">content.js was not found. Keep it in the same folder as index.html.</p>';return}
  SITE=window.SITE;
  const mx=Math.max(...SITE.plan.map(x=>x.topic));for(let i=1;i<=mx+(CHECK?1:0);i++){if(!await load('topic'+i+'.js'))break}
  TOP=SITE.topics.slice().sort((a,b)=>a.n-b.n);
  try{ST=Object.assign({c:{},q:{}},JSON.parse(localStorage.getItem(key())))}catch(e){}
  $('#hd').innerHTML=`<h1>${esc(SITE.subject)}</h1><div class="mu">${esc(SITE.course)}. ${esc(SITE.teacher)}. Set on ${esc(SITE.platform)}.${SITE.checked&&SITE.checked.by?` Checked by ${esc(SITE.checked.by)} on ${esc(SITE.checked.on)}.`:` Version ${esc(SITE.version)}.`}</div>`;
  addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
